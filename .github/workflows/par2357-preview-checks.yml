name: PAR2357 contract and preview checks

on:
  push:
    branches:
      - feat/par2357-readonly-api-transport
  pull_request:
    paths:
      - 'src/integrations/**'
      - 'src/components/views/Par2357TicketsPreviewView.tsx'
      - 'src/App.tsx'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no lifecycle scripts)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Run contract tests (synthetic)
        run: node --import tsx --test tests/par2357Dtos.test.ts tests/portalApiClient.test.ts tests/ticketContractBoundary.test.ts
      - name: Compile frontend
        run: npm run build
      - name: Compile synthetic-only opt-in previews
        env:
          VITE_PAR2357_OVERVIEW_PREVIEW: 'true'
          VITE_PAR2357_TICKETS_PREVIEW: 'true'
          VITE_PAR2357_INDICATORS_PREVIEW: 'true'
          VITE_PAR2357_API_BASE_URL: ''
        run: npm run build
